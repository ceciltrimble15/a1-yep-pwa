name: YEP POC acceptance

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package*.json'
      - 'vite.config.js'
      - '.github/workflows/yep-poc-acceptance.yml'
  push:
    branches:
      - 'codex/yep-visual-teaching-foundation-2026-11-15'
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package*.json'
      - 'vite.config.js'
      - '.github/workflows/yep-poc-acceptance.yml'

permissions:
  contents: read

jobs:
  build-and-browser-acceptance:
    name: Build and browser resilience
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Validate YEP data and progression
        run: |
          npm run test:rev3
          npm run test:tablet
      - name: Build POC
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify real UI and device resilience
        run: |
          npm run test:browser
          npm run test:browser:resilience
      - name: Capture test evidence when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yep-poc-browser-acceptance
          path: |
            qa-output/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
