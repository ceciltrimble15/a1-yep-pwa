name: Full-app historical teaching module checks
on:
  pull_request:
    paths:
      - 'full-app/black-history/**'
      - '.github/workflows/history-module-checks.yml'
  push:
    branches:
      - 'feature/full-app-black-history-quest-catalog-2026-11'
permissions:
  contents: read
jobs:
  history-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check verified lesson facts and safe teaching structure
        run: node --test full-app/black-history/verifiedLessons.test.js
      - name: Check JSX and CSS bundle compilation
        run: |
          npm ci
          npm run build
